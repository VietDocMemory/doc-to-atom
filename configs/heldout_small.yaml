# Document-disjoint held-out diagnostic. Not a paper-scale training configuration.
_base_: resource_constrained.yaml
training:
  max_epochs: 3
  max_steps: 48
  gradient_accumulation_steps: 1
  warmup_steps: 0
  validation_every_steps: 8
  initial_curriculum_step: 2000
  early_stopping_patience: 3
data:
  max_questions_per_sample: 2
evaluation:
  routing_recall_k: 4
  max_new_tokens: 16
