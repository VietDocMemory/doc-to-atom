# Runnable single-GPU Qwen profile for full D2A-only benchmark runs.
_base_: resource_constrained.yaml
model:
  name: Qwen/Qwen3-4B-Instruct-2507
  family: qwen3
  hidden_size: 2560
  decoder_layers: 36
  memory_layer_indices: [32, 33, 34, 35]
  target_modules: [q_proj, v_proj, o_proj, down_proj]
  dtype: bfloat16
  flash_attention_2: true
  frozen: true
training:
  learning_rate: 8.0e-5
