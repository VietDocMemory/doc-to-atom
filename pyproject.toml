[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-to-atom"
version = "0.1.0"
description = "Faithful, audit-first reproduction scaffold for Doc-to-Atom"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6",
  "transformers>=4.51,<5",
  "sentence-transformers>=3.1",
  "pydantic>=2.10,<3",
  "PyYAML>=6",
  "datasets>=3.6",
  "rouge-score>=0.1.2",
  "openai>=1.70",
  "numpy>=1.26",
]

[project.optional-dependencies]
train = ["accelerate>=1.6", "deepspeed>=0.17; platform_system != 'Windows'"]
test = ["pytest>=8"]

[project.scripts]
doc2atom-atomize = "doc_to_atom.atomization.cli:main"
doc2atom-validate = "doc_to_atom.data.validation_cli:main"
doc2atom-smoke = "doc_to_atom.training.smoke:main"
doc2atom-train = "doc_to_atom.training.cli:main"
doc2atom-evaluate = "doc_to_atom.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

