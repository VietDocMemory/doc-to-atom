[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-to-atom"
version = "0.1.0"
description = "Faithful, audit-first reproduction scaffold for Doc-to-Atom"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6",
  "transformers>=4.51,<5",
  "sentence-transformers>=3.1",
  "pydantic>=2.10,<3",
  "PyYAML>=6",
  "datasets>=3.6",
  "rouge-score>=0.1.2",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "safetensors>=0.4,<1",
  "wandb>=0.18,<1",
]

[project.optional-dependencies]
train = ["accelerate>=1.6", "deepspeed>=0.17; platform_system != 'Windows'"]
test = ["pytest>=8"]

[project.scripts]
doc2atom-atomize = "doc_to_atom.atomization.cli:main"
doc2atom-migrate-v2 = "doc_to_atom.atomization.migration_cli:main"
doc2atom-validate = "doc_to_atom.data.validation_cli:main"
doc2atom-smoke = "doc_to_atom.training.smoke:main"
doc2atom-train = "doc_to_atom.training.cli:main"
doc2atom-evaluate = "doc_to_atom.evaluation.cli:main"
doc2atom-compare = "doc_to_atom.evaluation.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: bounded multi-component integration tests",
  "distributed: multi-process CPU/Gloo regression tests",
  "molab: explicit two-GPU CUDA/NCCL/DeepSpeed integration gate",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

